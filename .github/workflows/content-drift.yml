name: Content drift

# Runs the integration tests against ComplianceAsCode/content master, to find
# content format changes the server doesn't handle yet. CI pins a content commit
# (CONTENT_REF in ci.yml); when this workflow passes, that pin can be bumped to
# the commit printed below.

on:
  schedule:
    - cron: "17 4 * * 1"
  workflow_dispatch:

jobs:
  integration:
    name: Integration tests against content master
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: "3.12"
        cache: 'pip'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -e ".[dev]"

    - name: Check out ComplianceAsCode/content master
      uses: actions/checkout@v4
      with:
        repository: ComplianceAsCode/content
        path: cac-content
        fetch-depth: 1

    - name: Show the content commit
      run: git -C cac-content log -1 --format='%H %cs %s'

    - name: Run integration tests
      env:
        CONTENT_REPO: ${{ github.workspace }}/cac-content
      run: |
        pytest tests/integration --no-cov
